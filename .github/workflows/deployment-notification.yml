name: Vercel Deployment Notification

on:
  repository_dispatch:
    types:
      - vercel.deployment.success
      - vercel.deployment.error
      - vercel.deployment.canceled

jobs:
  notify-discord:
    runs-on: ubuntu-latest

    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_ACTION: ${{ github.event.action }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_ACTION" = "vercel.deployment.success" ]; then
            TITLE="🚀 Deployment Successful"
            DESCRIPTION="A new deployment has been successfully deployed to Vercel."
          elif [ "$EVENT_ACTION" = "vercel.deployment.error" ]; then
            TITLE="❌ Deployment Failed"
            DESCRIPTION="The Vercel deployment failed."
          elif [ "$EVENT_ACTION" = "vercel.deployment.canceled" ]; then
            TITLE="⚠️ Deployment Canceled"
            DESCRIPTION="The Vercel deployment was canceled."
          else
            TITLE="📦 Vercel Deployment"
            DESCRIPTION="Vercel deployment status changed."
          fi

          curl -H "Content-Type: application/json" \
            -d "{
              \"username\": \"Cafton Deployments\",
              \"embeds\": [{
                \"title\": \"$TITLE\",
                \"description\": \"$DESCRIPTION\",
                \"fields\": [
                  {
                    \"name\": \"Repository\",
                    \"value\": \"$REPOSITORY\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"Event\",
                    \"value\": \"$EVENT_ACTION\",
                    \"inline\": true
                  }
                ],
                \"footer\": {
                  \"text\": \"Cafton CI/CD\"
                }
              }]
            }" \
            "$DISCORD_WEBHOOK_URL"
